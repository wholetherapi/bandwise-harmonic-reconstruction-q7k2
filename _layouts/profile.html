<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>{{ page.title | default: site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  </head>
  <body>
    <header>
      <h1>{{ site.author.name }}</h1>
      <p class="role">{{ site.author.role }}</p>
      <p class="affiliation">{{ site.author.affiliation }}</p>
    </header>
    <main>
      {{ content }}
    </main>
    <footer>
      <p>{{ site.author.email }} &middot; {{ site.author.orcid }}</p>
    </footer>
  </body>
</html>
